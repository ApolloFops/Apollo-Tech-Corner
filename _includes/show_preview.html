<!-- A preview of a show. -->
<h2 class="post-title"><a href="{{ site.baseurl }}{{ include.show.url }}">{{ show.title }}</a></h2>
<span class="post-date">{{ include.show.date | date_to_string }}</span>
<br>
{% if include.show.location %}
<span class="show-location">{{ include.show.location }}</span>
{% endif %}
<p>
{% if include.show.image %}
<img src="{{ site.baseurl }}/{{ include.show.image }}" style="max-height: 200px;"/>
{% endif %}
{{ include.show.excerpt }}
</p>
